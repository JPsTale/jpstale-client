<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>大地图 Demo</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1117; color: #e6e9ee;
      font: 13px/1.5 "Microsoft YaHei", system-ui, sans-serif; }
    #wrap { display: flex; height: 100%; }
    #side { width: 250px; flex: none; overflow-y: auto; background: #131820; border-right: 1px solid #232a35; }
    #side .head { padding: 10px 12px; color: #93a1b3; font-size: 12px; border-bottom: 1px solid #232a35; }
    #side .item { display: block; width: 100%; text-align: left; padding: 8px 12px; background: none;
      border: 0; border-bottom: 1px solid #1b2230; color: #dfe5ec; cursor: pointer; font: inherit; }
    #side .item:hover { background: #1b2431; }
    #side .item.on { background: #1d2a3a; box-shadow: inset 3px 0 0 #ffd479; }
    #side .item em { display: block; font-style: normal; color: #8494a8; font-size: 11px; margin-top: 2px; }
    #main { position: relative; flex: 1; min-width: 0; }
    #cv { display: block; width: 100%; height: 100%; }
    #bar { position: absolute; left: 0; right: 0; top: 0; padding: 10px 14px; display: flex;
      gap: 10px; align-items: center; background: linear-gradient(#0d1117e6, #0d111700); pointer-events: none; }
    #crumb { font-size: 15px; font-weight: 600; pointer-events: auto; white-space: nowrap; }
    #crumb .link { color: #7fc4ff; cursor: pointer; }
    #hint { color: #8494a8; font-size: 12px; }
    #warn { display: none; margin: 8px 12px; padding: 8px 10px; background: #4a2020; border: 1px solid #7a3030;
      border-radius: 4px; color: #ffc9c0; font-size: 12px; }
      cursor: pointer; text-align: left; color: inherit; font: inherit; }
      background: #2a2020; color: #ffb4a8; font-size: 12px; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="side"></div>
    <div id="main">
      <canvas id="cv"></canvas>
      <div id="bar">
        <div id="crumb"></div>
        <div id="hint">左键下钻 · 右键/Esc 上升 · 滚轮缩放 · 拖拽平移　（大陆：世界→地图；世界图之外：世界→家族→地图）</div>
      </div>
      <div id="warn"></div>
    </div>
  </div>
  <script type="module" src="/src/tools/worldmap-demo.ts"></script>
</body>
</html>
