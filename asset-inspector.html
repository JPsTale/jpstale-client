<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JPsTale - 资产检查器</title>
    <style>
      :root {
        --bg: #14161c;
        --panel: #1b1f27;
        --line: #2c3340;
        --fg: #cfd6e0;
        --dim: #7c8798;
        --ok: #6ee7a8;
        --bad: #ff7676;
        --warn: #ffc857;
        --accent: #5b8ff9;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
        font: 12px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
      }
      body {
        display: grid;
        grid-template-columns: 300px 1fr 380px;
        grid-template-rows: auto 1fr auto;
      }
      #hud {
        grid-column: 1 / 4; grid-row: 1;
        padding: 6px 10px; background: #10131a; border-bottom: 1px solid var(--line);
        color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      #left  { grid-column: 1; grid-row: 2; border-right: 1px solid var(--line); }
      #app   { grid-column: 2; grid-row: 2; position: relative; min-width: 0; }
      #right { grid-column: 3; grid-row: 2; border-left: 1px solid var(--line); }
      #left, #right { overflow: auto; background: var(--panel); }
      #bottom {
        grid-column: 1 / 4; grid-row: 3; overflow: auto;
        background: var(--panel); border-top: 1px solid var(--line); max-height: 42vh;
      }
      #app canvas { display: block; }
      #log {
        position: absolute; left: 8px; bottom: 8px; max-width: 60%; max-height: 30%;
        overflow: auto; padding: 6px 8px; background: rgba(0, 0, 0, .72);
        border: 1px solid var(--line); color: #a8d8b9; white-space: pre-wrap;
        pointer-events: none; user-select: none; font-size: 11px;
      }

      /* 分组 */
      .ins-sec { border-bottom: 1px solid var(--line); }
      .ins-sec-head {
        padding: 6px 10px; background: #222836; cursor: pointer; user-select: none;
        font-weight: 600; color: #dbe3ee;
      }
      .ins-sec-head::before { content: '▾ '; color: var(--dim); }
      .ins-sec-body { padding: 6px 10px 10px; }
      .ins-sec--collapsed .ins-sec-body { display: none; }
      .ins-sec--collapsed .ins-sec-head::before { content: '▸ '; }

      /* 行 */
      .ins-row { display: flex; align-items: center; gap: 6px; margin: 5px 0; }
      .ins-label { flex: 0 0 auto; color: var(--dim); min-width: 96px; }
      .ins-select, .ins-text {
        flex: 1 1 auto; min-width: 0; background: #10131a; color: var(--fg);
        border: 1px solid var(--line); padding: 3px 5px; font: inherit;
      }
      .ins-range { flex: 1 1 auto; min-width: 0; }
      .ins-val { flex: 0 0 44px; text-align: right; color: var(--dim); }
      .ins-row--check { gap: 6px; }
      .ins-row--check .ins-label { min-width: 0; }
      .ins-btns { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; }
      .ins-btn {
        background: #263041; color: var(--fg); border: 1px solid var(--line);
        padding: 4px 8px; cursor: pointer; font: inherit;
      }
      .ins-btn:hover { background: #31405a; border-color: var(--accent); }

      /* 信息 / 提示 */
      .ins-info { display: flex; gap: 6px; margin: 3px 0; }
      .ins-info-k { color: var(--dim); min-width: 96px; }
      .ins-info-v { flex: 1 1 auto; word-break: break-all; }
      .ins-info--warn .ins-info-v { color: var(--warn); }
      .ins-note { white-space: pre-wrap; color: #b9c6d6; margin: 6px 0; word-break: break-all; }
      .ins-bonelist {
        max-height: 220px; overflow: auto; white-space: pre; color: #9fb0c4;
        background: #10131a; border: 1px solid var(--line); padding: 4px 6px; margin-top: 4px;
      }
      .ins-disabled { filter: grayscale(0.6); }
      .ins-dim { color: var(--dim); }
      .ins-ok { color: var(--ok); }
      .ins-bad { color: var(--bad); }

      /* 动作 */
      .ins-cands { padding: 2px 0 4px 26px; }
.ins-cand { font-size: 11px; color: #9fb6cc; cursor: pointer; padding: 1px 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ins-cand:hover { background: #1c2836; }
.ins-cand--sel { color: #7fd6a0; }
.ins-act {
        display: flex; gap: 8px; padding: 3px 4px; cursor: pointer; border-radius: 2px;
      }
      .ins-act:hover { background: #263041; }
      .ins-act-name { flex: 0 0 76px; }
      .ins-motion { padding: 2px 4px; cursor: pointer; color: #b9c6d6; }
      .ins-motion:hover { background: #263041; }

      /* 技能 */
      .ins-skill {
        display: flex; gap: 8px; align-items: baseline; padding: 3px 4px;
        cursor: pointer; border-bottom: 1px dashed #232a35;
      }
      .ins-skill:hover { background: #263041; }
      .ins-skill-name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .ins-chips { display: flex; gap: 3px; flex-wrap: wrap; align-items: center; }
      .ins-chip {
        background: #22303f; border: 1px solid var(--line); border-radius: 2px;
        padding: 0 4px; color: #9fd0e8; cursor: pointer; font-size: 11px; white-space: nowrap;
      }
      .ins-chip:hover { background: #2e4356; border-color: var(--accent); color: #d8f0ff; }
      .ins-chip--play { background: #1f3a2a; border-color: #2f6b47; color: #8fe0ad; }

      /* 动画映射对照：左=原版直出 右=派生语义 */
      .ins-xref-host { max-height: 46vh; overflow: auto; font-size: 11px; }
      .ins-xr { border-left: 3px solid #444; padding: 3px 6px; margin-bottom: 3px; background: #171b22; }
      .ins-xr--ok  { border-left-color: #2f6b47; }
      .ins-xr--bad { border-left-color: #a33; background: #241a1c; }
      .ins-xr--na  { border-left-color: #555; }
      .ins-xr-l { color: #8fa3b8; }
      .ins-xr-r { color: #cfe3f5; }
      .ins-xr-c { color: #ff9d7a; }
      /* 内联在 motion 条目下的派生语义行 */
      .ins-xr-inline { color: #93a7bd; font-size: 11px; padding-left: 10px; }
      .ins-xr-inline--bad { color: #ff9d7a; }
.ins-xr-inline--in { color: #7fd6a0; }
.ins-motion-bar { border-bottom: 1px solid #2b3644; margin-bottom: 6px; padding-bottom: 4px; }


      /* 诊断 */
      .ins-diag { display: flex; gap: 8px; padding: 2px 4px; border-bottom: 1px dashed #232a35; }
      .ins-diag--bad { background: #2a1c1e; }
      .ins-diag-g { flex: 0 0 52px; color: var(--accent); }
      .ins-diag-l { flex: 0 0 160px; }
      .ins-diag-e { flex: 1 1 auto; color: var(--dim); word-break: break-all; }
    
.ins-modal { position: fixed; inset: 0; background: rgba(4,8,12,.72); z-index: 999; display: flex; align-items: center; justify-content: center; }
.ins-modal-box { background: #131b23; border: 1px solid #33465c; width: min(920px, 94vw); max-height: 88vh; display: flex; flex-direction: column; }
.ins-mk-row { display: flex; gap: 6px; padding: 6px 8px; flex-wrap: wrap; align-items: center; }
.ins-mk-lvl1 { border-bottom: 1px solid #22303d; }
.ins-mk-lvl2 { border-bottom: 1px solid #22303d; }
.ins-mk-tab { background: #1b2733; color: #a9c2d8; border: 1px solid #2f4256; padding: 3px 9px; cursor: pointer; font-size: 12px; }
.ins-mk-tab--on { background: #2d5c86; color: #eaf3fb; border-color: #4d87bb; }
.ins-mk-tab:disabled { opacity: .45; cursor: not-allowed; }
.ins-mk-body { display: flex; flex: 1 1 auto; min-height: 0; }
.ins-mk-list { flex: 1 1 52%; overflow: auto; border-right: 1px solid #22303d; }
.ins-mk-head { position: sticky; top: 0; background: #16202a; color: #83a0ba; font-size: 11px; padding: 4px 8px; border-bottom: 1px solid #22303d; }
.ins-mk-item { display: flex; justify-content: space-between; padding: 3px 8px; cursor: pointer; font-size: 12px; }
.ins-mk-item:hover { background: #1c2836; }
.ins-mk-item--sel { background: #2d5c86; }
.ins-mk-item--cur { color: #7fd6a0; }
.ins-mk-ilv { color: #8aa6bf; }
.ins-mk-slot { width: 34px; flex: 0 0 auto; color: #c8a26a; font-size: 11px; }
.ins-mk-hand { width: 26px; flex: 0 0 auto; color: #7fb0d8; font-size: 11px; }
.ins-mk-iname { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ins-mk-detail { flex: 1 1 48%; overflow: auto; padding: 8px 10px; }
.ins-mk-name { color: #eaf3fb; font-size: 13px; margin: 4px 0 6px; }
.ins-mk-sec { color: #7fb0d8; font-size: 12px; border-bottom: 1px solid #22303d; margin-top: 8px; padding-bottom: 2px; }
.ins-mk-tbl { width: 100%; border-collapse: collapse; font-size: 12px; }
.ins-mk-k { color: #8aa6bf; width: 46%; padding: 2px 0; }
.ins-mk-v { color: #cfe3f5; }
.ins-mk-prev { height: 120px; display: flex; align-items: center; justify-content: center; background: #0b1016; border: 1px solid #22303d; }
.ins-mk-img { max-width: 100%; max-height: 116px; image-rendering: pixelated; }
.ins-mk-foot { border-top: 1px solid #22303d; justify-content: flex-end; }
.ins-mk-btn { background: #1b2733; color: #a9c2d8; border: 1px solid #2f4256; padding: 4px 12px; cursor: pointer; }
.ins-mk-btn--ok { background: #2d5c86; color: #eaf3fb; border-color: #4d87bb; }
</style>
  </head>
  <body>
    <div id="hud">初始化…</div>
    <div id="left"></div>
    <div id="app"><div id="log"></div></div>
    <div id="right"></div>
    <div id="bottom"></div>
    <script type="module" src="/src/tools/asset-inspector.ts"></script>
  </body>
</html>
