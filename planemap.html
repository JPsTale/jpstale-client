<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>平面图（大地图数据源）</title>
  <style>
    /* 底色 = 海色：水面在平面图里是**透明**的（`isWater` 材质不烘入），
       所以这一层底就相当于世界图的底色。改这里即可看不同底色下的观感。 */
    :root { --sea: #2a5d7c; --card: #14161c; }
    html, body { margin: 0; background: #0e1014; color: #dfe3e8;
      font: 13px/1.5 "Microsoft YaHei", "Segoe UI", sans-serif; }
    header { position: sticky; top: 0; z-index: 2; padding: 12px 16px; background: #0e1014ee;
      border-bottom: 1px solid #2a2f3a; display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; }
    h1 { font-size: 15px; margin: 0; font-weight: 600; }
    header .dim { color: #8b95a5; }
    #grid { display: grid; gap: 14px; padding: 16px;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    .card { background: var(--card); border: 1px solid #262b35; border-radius: 6px; overflow: hidden; }
    .card.missing { opacity: .45; }
    .thumb { background: var(--sea); aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; }
    .thumb img { max-width: 100%; max-height: 100%; display: block; }
    .thumb .none { color: #cfe6f5; font-size: 12px; opacity: .8; }
    .meta { padding: 8px 10px 10px; }
    .name { font-weight: 600; }
    .name .id { color: #8b95a5; font-weight: 400; margin-left: 6px; }
    .sub { color: #8b95a5; font-size: 12px; margin-top: 2px; }
    .bad { color: #ff8b7a; }
    a { color: #7fc4ff; }
  </style>
</head>
<body>
  <header>
    <h1>平面图（大地图数据源）</h1>
    <span class="dim" id="scale">比例尺读取中…</span>
    <span class="dim" id="count"></span>
    <span class="dim">底色 = 海色（水面不烘入，是透明的）</span>
    <span class="dim">比例尺可用 <code>?scale=8</code> 覆盖</span>
  </header>
  <div id="grid"></div>
  <script type="module" src="/src/tools/planemap-gallery.ts"></script>
</body>
</html>
