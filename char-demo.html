<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>JPsTale - Char Demo</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: system-ui, sans-serif;
      }
      #app {
        position: absolute;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #ui {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      #ui button {
        padding: 6px 12px;
        background: rgba(0,0,0,0.75);
        color: #cfc;
        border: 1px solid #486;
        font: 12px/1.4 monospace;
        cursor: pointer;
      }
      #ui button:hover {
        background: rgba(0,60,0,0.75);
      }
      #log {
        position: fixed;
        bottom: 8px;
        left: 8px;
        max-width: 500px;
        max-height: 200px;
        overflow: auto;
        padding: 6px 10px;
        background: rgba(0,0,0,0.72);
        color: #cfc;
        font: 11px/1.4 monospace;
        border: 1px solid #486;
        z-index: 9;
        user-select: none;
        pointer-events: none;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <div id="log"></div>
    <script type="module" src="/src/char/char-demo.ts"></script>
  </body>
</html>
